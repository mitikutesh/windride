name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No .env is provided: tests and build must pass without API keys (CLAUDE.md rule 3).
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Acceptance (v0.1 honesty gate, fixtures only)
        run: npm run accept

      - name: Build
        run: npm run build
