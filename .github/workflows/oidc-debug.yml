name: OIDC debug (temporary)

# TEMPORARY diagnostic for the AWS deploy-role trust: requests the same OIDC token the deploy
# workflow uses and prints ONLY its decoded identity claims (iss / aud / sub / ref / repository /
# environment) — never the token itself. Delete this file once the trust policy matches.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Print OIDC claims (iss/aud/sub only)
        run: |
          TOKEN_JSON=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          JWT=$(echo "$TOKEN_JSON" | jq -r '.value')
          PAYLOAD=$(echo "$JWT" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in 2) PAYLOAD="$PAYLOAD==";; 3) PAYLOAD="$PAYLOAD=";; esac
          echo "$PAYLOAD" | base64 -d | jq '{iss, aud, sub, ref, repository, environment}'
